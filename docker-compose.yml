services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: paxafe
      POSTGRES_PASSWORD: paxafe
      POSTGRES_DB: paxafe
    ports:
      # Host port 5435 avoids a local Postgres on 5432. Override with DB_PORT if 5435 is taken.
      - "${DB_PORT:-5435}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paxafe -d paxafe"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Optional: the API in a container. Start with `docker compose up -d --build api`.
  api:
    build: .
    profiles: ["app"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://paxafe:paxafe@db:5432/paxafe
      PORT: "3000"
      LOG_LEVEL: info
      SEED_API_KEY: ${SEED_API_KEY:-test-key-local}
    ports:
      - "${API_PORT:-3000}:3000"

volumes:
  pgdata:
