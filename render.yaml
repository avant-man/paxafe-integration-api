# Use the Neon direct URL. A pooled URL needs DATABASE_URL_DIRECT.
services:
  - type: web
    name: paxafe-integration-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    maxShutdownDelaySeconds: 30
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_DIRECT
        sync: false
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: RATE_LIMIT_PER_MIN
        value: "600"
      - key: RATE_LIMIT_PER_IP_PER_MIN
        value: "1200"
      - key: SEED_API_KEY
        generateValue: true   # Admin only: reads every account. Never give it to the sender.
